[project]
name = "mlplatform"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "scikit-learn",
    "mlflow",
    "pydantic-settings",
    "s3fs>=2025.9.0",
    "boto3",
    "sqlalchemy",
    "psycopg2-binary",
    "prefect",
    "fastapi",
    "uvicorn",
    "optuna",
    "xgboost",
    "torch",
    "matplotlib",
]

[dependency-groups]
dev = ["jupyter>=1.1.1", "pytest"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlplatform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
