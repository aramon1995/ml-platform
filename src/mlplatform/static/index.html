<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mlplatform · predict</title>
<style>
  :root {
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --bg: #f4f5fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --error: #b91c1c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { background: linear-gradient(120deg, #4f46e5, #7c3aed); color: #fff; padding: 1.6rem 1rem; }
  header div, main { max-width: 820px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 1.5rem; }
  header p { margin: .3rem 0 0; opacity: .85; }
  main { padding: 1.2rem 1rem 3rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem 1.4rem; margin-top: 1.2rem; box-shadow: 0 1px 3px rgba(0, 0, 0, .05); }
  .card h2 { margin: 0 0 1rem; font-size: 1.05rem; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .8rem; }
  .fact { background: var(--accent-soft); border-radius: 8px; padding: .6rem .8rem; }
  .fact small { display: block; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
  .fact b { font-size: 1.05rem; }
  .chips { margin-top: .9rem; display: flex; flex-wrap: wrap; gap: .35rem; }
  .chip { font-family: ui-monospace, monospace; font-size: .8rem; background: #f3f4f6; border: 1px solid var(--border); border-radius: 999px; padding: .15rem .6rem; }
  .toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 1rem; }
  .toggle input { display: none; }
  .toggle label { padding: .45rem 1rem; cursor: pointer; font-size: .9rem; color: var(--muted); }
  .toggle input:checked + label { background: var(--accent); color: #fff; }
  #form-mode { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .7rem 1rem; }
  #form-mode label { display: flex; flex-direction: column; font-family: ui-monospace, monospace; font-size: .8rem; color: var(--muted); gap: .25rem; }
  input[type=text], textarea { border: 1px solid var(--border); border-radius: 6px; padding: .45rem .6rem; font: inherit; color: var(--text); background: #fff; }
  input[type=text]:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  textarea { width: 100%; height: 13rem; font-family: ui-monospace, monospace; font-size: .85rem; }
  button { margin-top: 1.2rem; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: .6rem 1.6rem; font-size: 1rem; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .6; cursor: wait; }
  .muted { color: var(--muted); }
  .error { color: var(--error); background: #fef2f2; border-radius: 8px; padding: .7rem .9rem; white-space: pre-wrap; margin: 0; }
  .prediction { display: grid; grid-template-columns: 2rem 3rem 1fr; align-items: center; gap: .8rem; padding: .7rem 0; border-top: 1px solid var(--border); }
  .prediction:first-of-type { border-top: 0; }
  .badge { width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 1.1rem; }
  .bars { display: grid; gap: .25rem; }
  .bar { display: grid; grid-template-columns: 1.5rem 1fr 3.2rem; align-items: center; gap: .5rem; font-size: .8rem; }
  .track { height: .55rem; background: #eef0f4; border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; background: #a5b4fc; border-radius: 999px; }
  .bar.top .fill { background: var(--accent); }
  .bar.top { font-weight: 600; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div>
    <h1>mlplatform · predict</h1>
    <p>Prueba el modelo en producción servido por la API</p>
  </div>
</header>

<main>
  <section class="card">
    <h2>Modelo en producción</h2>
    <div id="model" class="muted">Cargando…</div>
  </section>

  <section class="card">
    <h2>Entrada</h2>
    <div class="toggle">
      <input type="radio" name="mode" id="mode-form" value="form" checked><label for="mode-form">Formulario (una fila)</label>
      <input type="radio" name="mode" id="mode-json" value="json"><label for="mode-json">JSON (lista de filas)</label>
    </div>
    <form id="form-mode"></form>
    <textarea id="json-mode" class="hidden"></textarea>
    <button id="predict">Predecir</button>
  </section>

  <section class="card">
    <h2>Resultado</h2>
    <div id="result" class="muted">Aún no hay predicciones.</div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let columns = [];

function parse(value) {
  if (value.trim() === "") return null;
  const number = Number(value);
  return Number.isNaN(number) ? value : number;
}

function rowsFromForm() {
  return [Object.fromEntries(columns.map((c) => [c, parse($("col-" + c).value)]))];
}

async function loadModel() {
  const health = await (await fetch("health")).json();
  const model = health.model;
  if (!model) {
    $("model").innerHTML = '<p class="error">No hay modelo de producción cargado.</p>';
    return;
  }
  columns = model.required_columns;
  const facts = [["Familia", model.model_family], ["Versión", "v" + model.model_version], ["Feature set", model.feature_set]];
  $("model").classList.remove("muted");
  $("model").innerHTML =
    `<div class="facts">${facts.map(([k, v]) => `<div class="fact"><small>${k}</small><b>${v}</b></div>`).join("")}</div>` +
    `<div class="chips">${columns.map((c) => `<span class="chip">${c}</span>`).join("")}</div>`;
  $("form-mode").innerHTML = columns.map((c) =>
    `<label>${c}<input type="text" id="col-${c}" placeholder="${c === "Timestamp" ? "2025-04-10 12:00:00" : "vacío = null"}"></label>`
  ).join("");
  $("json-mode").value = JSON.stringify([Object.fromEntries(columns.map((c) => [c, null]))], null, 2);
}

function showMode() {
  const json = $("mode-json").checked;
  $("form-mode").classList.toggle("hidden", json);
  $("json-mode").classList.toggle("hidden", !json);
}

function renderPrediction(p, i) {
  const bars = Object.entries(p.probabilities).map(([label, prob]) =>
    `<div class="bar ${label === p.predicted_value ? "top" : ""}"><span>${label}</span>` +
    `<div class="track"><div class="fill" style="width:${(prob * 100).toFixed(1)}%"></div></div>` +
    `<span>${(prob * 100).toFixed(1)}%</span></div>`
  ).join("");
  return `<div class="prediction"><span class="muted">#${i + 1}</span><div class="badge">${p.predicted_value}</div><div class="bars">${bars}</div></div>`;
}

async function predict() {
  let rows;
  try {
    rows = $("mode-json").checked ? JSON.parse($("json-mode").value) : rowsFromForm();
  } catch (e) {
    $("result").innerHTML = `<p class="error">JSON no válido: ${e.message}</p>`;
    return;
  }
  $("predict").disabled = true;
  try {
    const response = await fetch("predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rows }),
    });
    const body = await response.json();
    if (!response.ok) {
      const detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail, null, 2);
      $("result").innerHTML = `<p class="error">${response.status}: ${detail}</p>`;
      return;
    }
    $("result").classList.remove("muted");
    $("result").innerHTML =
      `<p class="muted">${body.model_family} v${body.model_version} · ${body.feature_set} · batch ${body.batch_id.slice(0, 8)}</p>` +
      body.predictions.map(renderPrediction).join("");
  } finally {
    $("predict").disabled = false;
  }
}

document.querySelectorAll("input[name=mode]").forEach((r) => r.addEventListener("change", showMode));
$("predict").addEventListener("click", predict);
$("form-mode").addEventListener("submit", (e) => { e.preventDefault(); predict(); });
loadModel();
</script>
</body>
</html>
